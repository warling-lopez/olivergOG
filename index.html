<!doctype html>
<html lang="es-DO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04091B" />

    <!-- Metadatos por defecto. Cada ruta los reescribe: <Seo/> en runtime y
         scripts/prerender.ts en el HTML servido. -->
    <title>Oliver G. | Consultoría de Negocios en Santiago, RD</title>
    <meta
      name="description"
      content="Consultoría y estrategia empresarial en Santiago, República Dominicana. Agenda una conversación de 30 minutos sin costo y descubre cómo llevar tu negocio al siguiente nivel."
    />
    <link rel="canonical" href="https://myprofolio.grolow.com/olivergOG/" />

    <!-- Open Graph estático: red de seguridad si el prerender no llega a correr -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Oliver G." />
    <meta property="og:locale" content="es_DO" />
    <meta property="og:title" content="Oliver G. | Consultoría de Negocios en Santiago, RD" />
    <meta
      property="og:description"
      content="Agenda una conversación de 30 minutos sin costo y descubre cómo crecer con visión, estrategia e impacto."
    />
    <meta property="og:url" content="https://myprofolio.grolow.com/olivergOG/" />
    <meta property="og:image" content="https://myprofolio.grolow.com/olivergOG/og/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Iconos -->
    <link rel="icon" type="image/svg+xml" href="/olivergOG/favicon.svg" />
    <link rel="apple-touch-icon" href="/olivergOG/apple-touch-icon.png" />
    <link rel="manifest" href="/olivergOG/site.webmanifest" />

    <!-- Fuentes autohospedadas: precarga solo lo crítico -->
    <link
      rel="preload"
      href="/olivergOG/fonts/archivo-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/olivergOG/fonts/inter-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" as="image" href="/olivergOG/img/oliver-hero.svg" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; color: #f7f9fc; font-family: system-ui">
        Este sitio necesita JavaScript. Escríbeme por WhatsApp al 829 884 7499.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
